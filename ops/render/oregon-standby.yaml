# Aplicar somente como parte da troca regional: existingResources=adopt.
# Preserva as variáveis existentes, altera a branch de operação e desativa o cron.
services:
  - type: web
    name: ecossistema-resiliencia
    repo: https://github.com/Gustavo13Cs/ecossistema-resiliencia
    branch: agent/codex/performance-diagnosis
    runtime: node
    rootDir: api
    region: oregon
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: REGIONAL_DATABASE_URL="$CLINICAL_DATABASE_URL" PROBE_REGION=oregon node dist/scripts/region-latency.js && exec node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: API_REGION
        value: oregon
      - key: DISABLE_SCHEDULED_ALERTS
        value: 'true'
