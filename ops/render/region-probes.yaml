# Sondas de leitura; não substituem nem adotam a API atual.
services:
  - type: web
    name: safemove-region-probe-oregon
    runtime: node
    rootDir: api
    region: oregon
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev --ignore-scripts && npx tsc scripts/region-latency.ts --outDir region-probe-dist --module commonjs --esModuleInterop --target ES2022 --skipLibCheck --strict
    startCommand: node region-probe-dist/region-latency.js
    healthCheckPath: /
    envVars:
      - key: PROBE_REGION
        value: oregon
      - key: PROBE_SERVE
        value: 'true'
      - key: NODE_VERSION
        value: 24.19.0
      - key: REGIONAL_DATABASE_URL
        fromService:
          type: web
          name: ecossistema-resiliencia
          envVarKey: CLINICAL_DATABASE_URL
  - type: web
    name: safemove-region-probe-virginia
    runtime: node
    rootDir: api
    region: virginia
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev --ignore-scripts && npx tsc scripts/region-latency.ts --outDir region-probe-dist --module commonjs --esModuleInterop --target ES2022 --skipLibCheck --strict
    startCommand: node region-probe-dist/region-latency.js
    healthCheckPath: /
    envVars:
      - key: PROBE_REGION
        value: virginia
      - key: PROBE_SERVE
        value: 'true'
      - key: NODE_VERSION
        value: 24.19.0
      - key: REGIONAL_DATABASE_URL
        fromService:
          type: web
          name: ecossistema-resiliencia
          envVarKey: CLINICAL_DATABASE_URL
