# .github/workflows/ci.yml
# Pipeline de CI — roda em todo push e PR para main

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------
  # Job 1: Testes unitarios da API (sem banco)
  # ---------------------------------------------------------------
  api-unit:
    name: "API — Testes Unitarios"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        working-directory: api
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: api
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
        run: npx prisma generate

      - name: Verificar compilacao TypeScript
        working-directory: api
        run: npx tsc --noEmit

      - name: Rodar testes unitarios
        working-directory: api
        run: npm test -- --passWithNoTests --forceExit

  # ---------------------------------------------------------------
  # Job 2: Testes e2e da API (com banco de teste isolado porta 5434)
  # ---------------------------------------------------------------
  api-e2e:
    name: "API — Testes E2E"
    runs-on: ubuntu-latest

    services:
      db-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecossistema_resiliencia_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ecossistema_resiliencia_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        working-directory: api
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
        run: npm ci

      - name: Gerar Prisma Client
        working-directory: api
        env:
          DIRECT_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
        run: npx prisma generate

      - name: Aplicar migrations no banco de teste
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
        run: npx prisma migrate deploy

      - name: Rodar testes e2e
        working-directory: api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5434/ecossistema_resiliencia_test
          JWT_SECRET: ci-test-secret-nao-usar-em-prod
        run: npm run test:e2e

  # ---------------------------------------------------------------
  # Job 3: Verificacao de tipagem do Frontend
  # ---------------------------------------------------------------
  web-typecheck:
    name: "Web — Verificacao TypeScript"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Verificar tipagem TypeScript
        working-directory: web
        run: npx tsc --noEmit

  # ---------------------------------------------------------------
  # Job 4: Testes Cypress (e2e do frontend)
  # ---------------------------------------------------------------
  web-cypress:
    name: "Web — Testes Cypress"
    runs-on: ubuntu-latest
    # So roda se os outros jobs passaram — evita falhas em cascata
    needs: [api-unit, api-e2e, web-typecheck]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Gerar build de producao
        working-directory: web
        run: npm run build

      - name: Rodar os fluxos profissionais no Cypress
        working-directory: web
        env:
          CYPRESS_BASE_URL: http://localhost:3001
        shell: bash
        run: |
          set -euo pipefail
          setsid npm run start -- -p 3001 &
          server_pid=$!
          trap 'kill -- -"$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:3001/auth/login >/dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "Next.js nao ficou pronto em 90 segundos."
              exit 1
            fi

            sleep 1
          done

          npx cypress run --headless --spec cypress/e2e/professional-registration.cy.ts,cypress/e2e/clients-create.cy.ts,cypress/e2e/clients-lifecycle.cy.ts
