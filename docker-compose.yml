services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecossistema_resiliencia
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecossistema_resiliencia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ecossistema_resiliencia_pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecossistema_resiliencia
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ecossistema_resiliencia
      ALLOWED_ORIGINS: http://localhost:3001
      TZ: UTC
    volumes:
      - ./api:/usr/src/app/api
      # Esse comando blinda o node_modules do container para não ser esmagado pelo Windows
      - /usr/src/app/api/node_modules 
    depends_on:
      db:
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - |
        # Em bancos que já existiam (produção), o baseline já foi aplicado
        # pelas migrations antigas. Marcamos como "resolvido" para o Prisma
        # não tentar re-criar tabelas que já existem.
        npx prisma migrate resolve --applied 20260813000000_baseline || true
        npx prisma migrate deploy
        node dist/src/main.js

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # Corrigido: Mapeando a 3001 do PC para a 3001 do container (onde o Next tá rodando)
      - "3001:3001" 
    env_file:
      - ./web/.env.local
    volumes:
      - ./web:/usr/src/app/web
      # Blinda o node_modules do frontend também
      - /usr/src/app/web/node_modules 
    depends_on:
      - api

volumes:
  ecossistema_resiliencia_pgdata:
