services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecossistema_resiliencia
    # Sem exposição de porta ao host: a API acessa via rede interna Docker (db:5432).
    # Se precisar conectar com um client externo (ex: DBeaver), adicione:
    #   ports:
    #     - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecossistema_resiliencia"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ecossistema_resiliencia_pgdata:/var/lib/postgresql/data

  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecossistema_resiliencia
      DIRECT_URL: postgresql://postgres:postgres@db:5432/ecossistema_resiliencia
      ALLOWED_ORIGINS: http://localhost:3001
      TZ: UTC
    volumes:
      - ./api:/usr/src/app/api
      # Esse comando blinda o node_modules do container para não ser esmagado pelo Windows
      - /usr/src/app/api/node_modules 
    depends_on:
      db:
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - |
        # Estratégia robusta para todos os cenários:
        #
        # Banco NOVO (Docker dev/CI): deploy roda baseline + add_agenda_core → OK
        #
        # Banco EXISTENTE com tabelas antigas (produção sem histórico Prisma):
        #   deploy tenta o baseline mas as tabelas já existem → falha
        #   então: resolvemos o baseline como "já aplicado" e fazemos deploy novamente
        #   → só add_agenda_core é executada → OK
        #
        # Banco JÁ MIGRADO (tem baseline + add_agenda_core no histórico):
        #   deploy não tem nada a fazer → sai com 0 → OK
        npx prisma migrate deploy || (
          npx prisma migrate resolve --applied 20260813000000_baseline &&
          npx prisma migrate deploy
        )
        node dist/src/main.js

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      # Corrigido: Mapeando a 3001 do PC para a 3001 do container (onde o Next tá rodando)
      - "3001:3001" 
    env_file:
      - ./web/.env.local
    volumes:
      - ./web:/usr/src/app/web
      # Blinda o node_modules do frontend também
      - /usr/src/app/web/node_modules 
    depends_on:
      - api

volumes:
  ecossistema_resiliencia_pgdata:
