services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    env_file:
      - ./api/.env.migrate
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env.runtime
    environment:
      NODE_ENV: development
      ALLOWED_ORIGINS: http://localhost:3001
      TZ: UTC
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: builder
    ports:
      - "3001:3001" 
    env_file:
      - ./web/.env.local
    environment:
      - NODE_ENV=development
      - INTERNAL_API_URL=http://api:3000
      - WATCHPACK_POLLING=true
    volumes:
      - ./web:/usr/src/app
      # Blinda o node_modules e .next do container para não ser esmagado pelo Windows
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    depends_on:
      - api
    command: ["npm", "run", "dev"]
