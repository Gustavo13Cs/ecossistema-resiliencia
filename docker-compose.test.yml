# docker-compose.test.yml
#
# Banco de dados isolado para testes e2e.
# NAO usa os dados de producao — banco separado na porta 5434.
#
# Uso:
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=... DIRECT_URL=... npx prisma migrate deploy
#   npm run test:e2e
#   docker compose -f docker-compose.test.yml down -v

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecossistema_resiliencia_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecossistema_resiliencia_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem volume persistente: banco e sempre limpo ao recriar o container
    tmpfs:
      - /var/lib/postgresql/data
